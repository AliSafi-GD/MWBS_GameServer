function renderBroadcasts(box) {
  const subject = h('input', { placeholder: 'Subject', dir: 'auto' });
  const body = h('input', { placeholder: 'Message (optional)', dir: 'auto' });
  const when = h('input', { type: 'datetime-local' });
  const audience = h('select', {}, h('option', { value: 'all' }, 'All active players'), h('option', { value: 'online' }, 'Only players online at send time'));
  const currency = h('input', { placeholder: 'currency, e.g. coins', dir: 'ltr' });
  const amount = h('input', { type: 'number', min: '1', placeholder: 'amount' });
  const itemId = h('input', { placeholder: 'item id (optional)', dir: 'ltr' });
  const itemQty = h('input', { type: 'number', min: '1', placeholder: 'qty' });
  const days = h('input', { type: 'number', min: '1', placeholder: 'expires after N days (optional)' });
  const list = h('div');

  async function create() {
    const reward = {};
    if (currency.value.trim() && Number(amount.value) > 0) reward.wallet = { [currency.value.trim()]: Number(amount.value) };
    if (itemId.value.trim() && Number(itemQty.value) > 0) reward.items = { [itemId.value.trim()]: Number(itemQty.value) };
    const payload = {
      subject: subject.value.trim(), body: body.value.trim() || null, audience: audience.value,
      runAtUtc: fromLocalInput(when.value), expiresInDays: days.value ? Number(days.value) : null,
      reward: reward.wallet || reward.items ? reward : null
    };
    try {
      await api('/liveops/broadcasts', { method: 'POST', body: JSON.stringify(payload) });
      toast(when.value ? 'Scheduled' : 'Queued: it is sent within seconds');
      subject.value = ''; body.value = '';
      load();
    } catch (ex) { handleError(ex); }
  }

  async function load() {
    try {
      const { items } = await api('/liveops/broadcasts?limit=50');
      list.replaceChildren(items.length === 0 ? h('p', { class: 'muted' }, 'No broadcasts yet.') :
        h('table', {},
          h('thead', {}, h('tr', {}, ['When', 'Subject', 'To', 'Status', 'Sent', ''].map(t => h('th', {}, t)))),
          h('tbody', {}, ...items.map(b => h('tr', { style: 'cursor:default' },
            h('td', {}, fmt(b.runUtc)),
            h('td', { dir: 'auto', title: b.error || b.subject }, b.subject),
            h('td', {}, b.audience),
            h('td', {}, h('span', { class: 'badge' + (b.status === 'failed' ? ' banned' : '') }, b.status)),
            h('td', {}, b.sentCount ?? '-'),
            h('td', {}, b.status === 'sending' ? '' : h('button', {
              class: 'danger',
              onclick: async () => {
                try { await api(`/liveops/broadcasts/${b.id}`, { method: 'DELETE' }); load(); } catch (ex) { handleError(ex); }
              }
            }, b.status === 'pending' ? 'Cancel' : 'Remove')))))));
    } catch (ex) { handleError(ex); }
  }

  box.replaceChildren(
    h('h2', { style: 'margin-top:0' }, 'Scheduled messages'),
    h('p', { class: 'muted' }, 'Inbox messages (with an optional reward) sent at a chosen time. Leave the time empty to send now. Times are in your local time zone.'),
    h('div', { class: 'form' },
      subject, body,
      h('label', {}, 'Send at', when),
      h('label', {}, 'Audience', audience),
      h('div', { class: 'row', style: 'margin-top:0' }, currency, amount),
      h('div', { class: 'row', style: 'margin-top:0' }, itemId, itemQty),
      days),
    h('div', { class: 'row' }, h('button', { class: 'primary', onclick: create }, 'Schedule')),
    list);
  load();
}

function renderTournaments(box) {
  const state = { value: {}, isPublic: true };
  const standings = h('div');
  const list = h('div');
  const form = h('div');

  async function load() {
    try {
      const cfg = (await api('/config')).items.find(e => e.key === 'tournaments');
      state.value = cfg ? cfg.value : {};
      state.isPublic = cfg ? cfg.isPublic : true;
      draw();
    } catch (ex) { handleError(ex); }
  }

  async function saveAll(next, message) {
    try {
      await api('/config/tournaments', { method: 'PUT', body: JSON.stringify({ value: next, public: true }) });
      toast(message || 'Saved');
      await load();
    } catch (ex) { handleError(ex); }
  }

  function statusOf(t) {
    const now = Date.now();
    if (now < new Date(t.start)) return 'upcoming';
    if (now >= new Date(t.end)) return 'ended';
    return 'active';
  }

  async function showStandings(id) {
    try {
      const b = await api(`/leaderboards/${enc('tournament:' + id)}?limit=20`);
      standings.replaceChildren(
        h('h3', {}, `Standings: ${id}`),
        b.entries.length === 0 ? h('p', { class: 'muted' }, 'No scores yet.') :
        h('table', {},
          h('thead', {}, h('tr', {}, ['#', 'Player', 'Score'].map(t => h('th', {}, t)))),
          h('tbody', {}, ...b.entries.map(e => h('tr', { style: 'cursor:default' },
            h('td', {}, e.rank), h('td', { dir: 'auto' }, e.displayName || e.username), h('td', {}, e.score))))));
    } catch (ex) { handleError(ex); }
  }

  function draw() {
    const ids = Object.keys(state.value);
    list.replaceChildren(ids.length === 0 ? h('p', { class: 'muted' }, 'No tournaments yet.') :
      h('table', {},
        h('thead', {}, h('tr', {}, ['Id', 'Status', 'Ends', ''].map(t => h('th', {}, t)))),
        h('tbody', {}, ...ids.map(id => {
          const t = state.value[id];
          return h('tr', { style: 'cursor:default' },
            h('td', {}, id), h('td', {}, statusOf(t)), h('td', {}, fmt(t.end)),
            h('td', {},
              h('div', { class: 'inline' },
                h('button', { onclick: () => edit(id) }, 'Edit'),
                h('button', { onclick: () => showStandings(id) }, 'Standings'),
                h('button', {
                  onclick: () => {
                    const next = structuredClone(state.value);
                    next[id].end = new Date(new Date(t.end).getTime() + 7 * 86400000).toISOString();
                    saveAll(next, 'Extended by 7 days');
                  }
                }, '+7d'),
                h('button', {
                  class: 'danger',
                  onclick: () => {
                    if (!confirm(`Remove tournament "${id}" from the config? Scores already recorded stay in the database.`)) return;
                    const next = structuredClone(state.value);
                    delete next[id];
                    saveAll(next, 'Removed');
                  }
                }, 'Delete'))));
        }))));
    edit(null);
  }

  function edit(id) {
    const t = id ? state.value[id] : null;
    const idIn = h('input', { value: id || '', placeholder: 'winter_cup', disabled: !!id, dir: 'ltr' });
    const nameEn = h('input', { value: (t && t.name && t.name.en) || '', placeholder: 'Name (English)' });
    const nameFa = h('input', { value: (t && t.name && t.name.fa) || '', placeholder: 'نام (فارسی)', dir: 'rtl' });
    const start = h('input', { type: 'datetime-local', value: toLocalInput(t ? t.start : new Date().toISOString()) });
    const end = h('input', { type: 'datetime-local', value: toLocalInput(t ? t.end : new Date(Date.now() + 7 * 86400000).toISOString()) });
    const sort = h('select', {}, h('option', { value: 'desc' }, 'higher score is better'), h('option', { value: 'asc' }, 'lower score is better'));
    sort.value = (t && t.sort) || 'desc';
    const op = h('select', {}, ...['best', 'set', 'incr'].map(o => h('option', { value: o }, 'operator: ' + o)));
    op.value = (t && t.operator) || 'best';
    const feeEntries = Object.entries((t && t.entryFee) || {});
    const feeName = h('input', { value: feeEntries[0] ? feeEntries[0][0] : 'coins', dir: 'ltr' });
    const feeAmount = h('input', { type: 'number', min: '0', value: feeEntries[0] ? feeEntries[0][1] : 0 });
    const rewards = h('textarea', { spellcheck: 'false', dir: 'ltr', style: 'min-height:120px' },
      JSON.stringify((t && t.rewards) || [{ fromRank: 1, toRank: 1, wallet: { coins: 1000 } }], null, 2));

    function save() {
      const key = idIn.value.trim();
      let parsedRewards;
      try { parsedRewards = JSON.parse(rewards.value); } catch (ex) { toast('Rewards is not valid JSON: ' + ex.message, true); return; }
      if (!start.value || !end.value) { toast('Start and end are required', true); return; }
      const entry = Object.assign({}, t || {}, {
        name: Object.fromEntries([['en', nameEn.value.trim()], ['fa', nameFa.value.trim()]].filter(([, v]) => v)),
        start: fromLocalInput(start.value), end: fromLocalInput(end.value),
        sort: sort.value, operator: op.value, rewards: parsedRewards
      });
      if (Number(feeAmount.value) > 0 && feeName.value.trim()) entry.entryFee = { [feeName.value.trim()]: Number(feeAmount.value) };
      else delete entry.entryFee;
      const next = structuredClone(state.value);
      next[key] = entry;
      saveAll(next);
    }

    form.replaceChildren(
      h('h3', {}, id ? `Edit ${id}` : 'New tournament'),
      h('div', { class: 'form' },
        idIn, nameEn, nameFa,
        h('label', {}, 'Starts', start), h('label', {}, 'Ends', end),
        sort, op,
        h('div', { class: 'row', style: 'margin-top:0' }, feeName, feeAmount),
        h('label', {}, 'Rewards (JSON: tiers of fromRank..toRank with wallet and/or items)', rewards)),
      h('div', { class: 'row' },
        h('button', { class: 'primary', onclick: save }, 'Save'),
        id ? h('button', { onclick: () => edit(null) }, 'New instead') : ''));
  }

  box.replaceChildren(
    h('h2', { style: 'margin-top:0' }, 'Tournaments'),
    h('p', { class: 'muted' }, 'Stored in the config key "tournaments" (every change is in the audit log and can be rolled back in the Config tab).'),
    list, form, standings);
  load();
}

// ---- modules + RPC tester ------------------------------------------------------------------------------

function renderModules(container) {
  const info = h('section', { class: 'card' });
  const tester = h('section', { class: 'card' });
  container.replaceChildren(h('div', { class: 'grid' }, info, tester));

  const userId = h('input', { placeholder: 'Player id (or search by name below)', dir: 'ltr' });
  const search = h('input', { placeholder: 'Search players by name…', dir: 'auto' });
  const found = h('div', { class: 'row', style: 'margin-top:0' });
  const rpc = h('select', {});
  const payload = h('textarea', { spellcheck: 'false', dir: 'ltr', style: 'min-height:110px' }, '{}');
  const out = h('div');
  let timer = null;

  search.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const q = search.value.trim();
      if (!q) { found.replaceChildren(); return; }
      try {
        const page = await api(`/users?q=${enc(q)}&limit=8`);
        found.replaceChildren(...page.items.map(u => h('button', {
          dir: 'auto', onclick: () => { userId.value = u.id; found.replaceChildren(); }
        }, u.displayName || u.username)));
      } catch (ex) { handleError(ex); }
    }, 300);
  });

  async function run() {
    const body = { userId: userId.value.trim(), id: rpc.value, payload: payload.value };
    try {
      const r = await api('/rpc-test', { method: 'POST', body: JSON.stringify(body) });
      let shown = r.ok ? r.result : `${r.error}: ${r.message}`;
      if (r.ok) { try { shown = JSON.stringify(JSON.parse(r.result), null, 2); } catch (e) { /* not JSON */ } }
      out.replaceChildren(
        h('p', { class: r.ok ? 'muted' : 'err' }, `${r.ok ? 'OK' : 'Failed'} in ${r.ms} ms`),
        h('pre', {}, shown));
    } catch (ex) { handleError(ex); }
  }

  async function load() {
    try {
      const m = await api('/modules');
      const hooked = new Set(m.rpcHooks);
      rpc.replaceChildren(...m.rpcs.map(id => h('option', { value: id }, id)));
      info.replaceChildren(
        h('h2', { style: 'margin-top:0' }, 'Loaded modules'),
        h('h3', {}, `RPCs (${m.rpcs.length})`),
        m.rpcs.length === 0 ? h('p', { class: 'muted' }, 'No RPCs registered.') :
          h('div', {}, ...m.rpcs.map(id => h('div', {}, id, hooked.has(id) ? h('span', { class: 'muted' }, '  (has hooks)') : ''))),
        h('h3', {}, `Match handlers (${m.matchHandlers.length})`),
        m.matchHandlers.length === 0 ? h('p', { class: 'muted' }, 'None.') : h('div', {}, ...m.matchHandlers.map(n => h('div', {}, n))),
        h('h3', {}, 'Match transports'),
        h('div', {}, m.transports.join(', ') || '-'));
    } catch (ex) { handleError(ex); }
  }

  tester.replaceChildren(
    h('h2', { style: 'margin-top:0' }, 'RPC tester'),
    h('p', { class: 'muted' }, 'Runs a module RPC as the chosen player, hooks included. It changes real data, so test on a test account.'),
    h('div', { class: 'form' }, search, found, userId, rpc, h('label', {}, 'Payload', payload)),
    h('div', { class: 'row' }, h('button', { class: 'primary', onclick: run }, 'Run')),
    out);
  load();
}

// ---- admin accounts ------------------------------------------------------------------------------------

function renderAdmins(container) {
  const list = h('section', { class: 'card' });
  const form = h('section', { class: 'card' });
  const keyBox = h('div');
  container.replaceChildren(h('div', { class: 'grid' }, list, h('div', {}, form, keyBox)));

  function showKey(who, key) {
    const pre = h('pre', {}, key);
    keyBox.replaceChildren(h('section', { class: 'card', style: 'margin-top:16px' },
      h('strong', {}, `Key for ${who}`),
      h('p', { class: 'muted' }, 'Copy it now. Only a hash is stored, so it cannot be shown again (use "New key" if it gets lost).'),
      pre, h('div', { class: 'row' }, copyButton(() => key))));
  }

  async function load() {
    try {
      const { items } = await api('/admins');
      list.replaceChildren(
        h('h2', { style: 'margin-top:0' }, 'Admins'),
        h('p', { class: 'muted' }, 'The key from the server settings always works as "root" (Admin). Everyone else is listed here.'),
        items.length === 0 ? h('p', { class: 'muted' }, 'No other admins yet.') :
        h('table', {},
          h('thead', {}, h('tr', {}, ['Name', 'Role', 'Last used', ''].map(t => h('th', {}, t)))),
          h('tbody', {}, ...items.map(a => {
            const role = h('select', { style: 'width:auto', onchange: () => update(a.id, { role: role.value }) },
              ...['Admin', 'Support', 'ReadOnly'].map(r => h('option', { value: r }, r)));
            role.value = a.role;
            return h('tr', { style: 'cursor:default' },
              h('td', {}, a.name, a.disabled ? h('span', { class: 'badge banned', style: 'margin-left:6px' }, 'disabled') : ''),
              h('td', {}, role), h('td', {}, fmt(a.lastUsedUtc)),
              h('td', {}, h('div', { class: 'inline' },
                h('button', { onclick: () => update(a.id, { disabled: !a.disabled }) }, a.disabled ? 'Enable' : 'Disable'),
                h('button', {
                  onclick: async () => {
                    if (!confirm(`Replace the key of ${a.name}? The old key stops working.`)) return;
                    try { showKey(a.name, (await api(`/admins/${a.id}/reset-key`, { method: 'POST' })).key); } catch (ex) { handleError(ex); }
                  }
                }, 'New key'),
                h('button', {
                  class: 'danger',
                  onclick: async () => {
                    if (!confirm(`Delete admin ${a.name}?`)) return;
                    try { await api(`/admins/${a.id}`, { method: 'DELETE' }); load(); } catch (ex) { handleError(ex); }
                  }
                }, 'Delete'))));
          }))));
    } catch (ex) { handleError(ex); }
  }

  async function update(id, patch) {
    try { await api(`/admins/${id}`, { method: 'PUT', body: JSON.stringify(patch) }); toast('Saved'); load(); }
    catch (ex) { handleError(ex); load(); }
  }

  const name = h('input', { placeholder: 'Name, e.g. sara', dir: 'ltr' });
  const role = h('select', {},
    h('option', { value: 'Support' }, 'Support: moderation only (ban, mute, delete chat, send messages)'),
    h('option', { value: 'ReadOnly' }, 'ReadOnly: can look, cannot change anything'),
    h('option', { value: 'Admin' }, 'Admin: everything, including admins and config'));
  form.replaceChildren(
    h('h2', { style: 'margin-top:0' }, 'New admin'),
    h('div', { class: 'form' }, name, role),
    h('div', { class: 'row' }, h('button', {
      class: 'primary',
      onclick: async () => {
        try {
          const r = await api('/admins', { method: 'POST', body: JSON.stringify({ name: name.value.trim(), role: role.value }) });
          name.value = '';
          showKey(r.account.name, r.key);
          load();
        } catch (ex) { handleError(ex); }
      }
    }, 'Create')));
  load();
}

// ---- audit log -----------------------------------------------------------------------------------------

function renderAudit(container) {
  const actor = h('input', { placeholder: 'Actor (exact name)', dir: 'ltr' });
  const q = h('input', { placeholder: 'Search path or body…', dir: 'auto' });
  const tbody = h('tbody');
  const more = h('button', {}, 'Load more');
  let last = null;

  async function load(append) {
    const params = new URLSearchParams({ limit: '100' });
    if (actor.value.trim()) params.set('actor', actor.value.trim());
    if (q.value.trim()) params.set('q', q.value.trim());
    if (append && last) params.set('before', String(last));
    try {
      const { items } = await api('/audit?' + params);
      if (!append) tbody.replaceChildren();
      for (const e of items) {
        tbody.append(h('tr', { style: 'cursor:default', title: e.body || '' },
          h('td', {}, fmt(e.atUtc)),
          h('td', {}, `${e.actor} (${e.role})`),
          h('td', {}, `${e.method} ${e.path}`),
          h('td', {}, h('span', { class: 'badge' + (e.status >= 400 ? ' banned' : '') }, e.status)),
          h('td', { dir: 'ltr', title: e.body || '' }, e.body || ''),
          h('td', {}, e.ip || '')));
        last = e.id;
      }
      more.hidden = items.length < 100;
    } catch (ex) { handleError(ex); }
  }

  more.addEventListener('click', () => load(true));
  container.replaceChildren(h('section', { class: 'card' },
    h('h2', { style: 'margin-top:0' }, 'Audit log'),
    h('p', { class: 'muted' }, 'Every change made through the admin API, kept for 180 days. Secrets in request bodies are hidden. Hover a row to see the full body.'),
    h('div', { class: 'row', style: 'margin-top:0' }, actor, q, h('button', { class: 'primary', onclick: () => load(false) }, 'Search')),
    h('table', {},
      h('thead', {}, h('tr', {}, ['When', 'Who', 'Action', 'Status', 'Body', 'IP'].map(t => h('th', {}, t)))),
      tbody),
    h('div', { class: 'row' }, more)));
  load(false);
}

// ---- start ---------------------------------------------------------------------------------------------

(async function start() {
  if (!adminKey) { renderLogin(); return; }
  try {
    me = await api('/me');
    route();
  } catch (ex) {
    signOut(ex.status === 403 && ex.code === 'forbidden' ? 'The admin key was rejected.' : ex.message);
  }
})();
</script>
