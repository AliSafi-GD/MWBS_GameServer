<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameServer Playground</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --text:#1c2127; --muted:#6b7480; --line:#e1e4e8; --accent:#2563eb; --on-accent:#fff;
    --danger:#c62828; --ok:#1b7f4b; --code:#f0f2f5;
    --get:#1b7f4b; --post:#2563eb; --put:#b7791f; --delete:#c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --panel:#1c2024; --text:#e6e8eb; --muted:#9aa4af; --line:#2c3238; --accent:#6ea0ff; --on-accent:#0b1020;
            --danger:#ff6b6b; --ok:#4cc38a; --code:#111417; --get:#4cc38a; --post:#6ea0ff; --put:#e0b04a; --delete:#ff6b6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  header .grow { flex:1; }
  .layout { display:grid; grid-template-columns:220px minmax(0,1fr); gap:16px; max-width:1300px; margin:0 auto; padding:16px; }
  @media (max-width:860px) { .layout { grid-template-columns:1fr; } nav { position:static !important; } }
  nav { position:sticky; top:62px; align-self:start; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; max-height:calc(100vh - 80px); overflow:auto; }
  nav a { display:block; padding:5px 10px; border-radius:6px; color:var(--text); text-decoration:none; cursor:pointer; }
  nav a:hover, nav a.on { background:var(--code); color:var(--accent); }
  nav h4 { margin:10px 10px 2px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  input, select, textarea { padding:6px 9px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--text); font:inherit; }
  textarea { width:100%; font-family:ui-monospace,Consolas,monospace; font-size:12.5px; direction:ltr; text-align:left; }
  input.ltr, textarea, pre, code { direction:ltr; text-align:left; }
  button { padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--text); font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  h2 { margin:20px 0 10px; font-size:17px; } h2:first-child { margin-top:0; }
  h3 { margin:0; font-size:14px; }
  .muted { color:var(--muted); }
  .ep-head { display:flex; gap:10px; align-items:center; cursor:pointer; }
  .badge { font:700 11px ui-monospace,Consolas,monospace; padding:2px 7px; border-radius:5px; color:#fff; min-width:54px; text-align:center; }
  .GET{background:var(--get)} .POST{background:var(--post)} .PUT{background:var(--put)} .DELETE{background:var(--delete)}
  .ep-path { font-family:ui-monospace,Consolas,monospace; font-size:13px; direction:ltr; }
  .lock { font-size:11px; color:var(--muted); }
  .ep-body { display:none; margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; }
  .ep.open .ep-body { display:block; }
  .row { display:flex; gap:8px; align-items:center; margin:5px 0; }
  .row label { min-width:110px; font-family:ui-monospace,Consolas,monospace; font-size:12px; direction:ltr; text-align:left; color:var(--muted); }
  .row input { flex:1; direction:ltr; }
  pre { background:var(--code); border-radius:8px; padding:10px 12px; margin:8px 0 0; overflow:auto; max-height:360px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
  .st { font-weight:700; } .st.ok { color:var(--ok); } .st.bad { color:var(--danger); }
  .tools { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .log { height:320px; overflow:auto; background:var(--code); border-radius:8px; padding:8px 10px; font:12px ui-monospace,Consolas,monospace; direction:ltr; text-align:left; }
  .log div { white-space:pre-wrap; word-break:break-all; padding:1px 0; }
  .log .in { color:var(--ok); } .log .out { color:var(--accent); } .log .sys { color:var(--muted); } .log .err { color:var(--danger); }
  .step { display:flex; gap:12px; }
  .step .n { flex:none; width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-weight:700; }
  .step.done .n { background:var(--ok); }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; background:var(--code); font-size:12px; }
  .hidden { display:none !important; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:760px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>🎮 GameServer Playground</h1>
  <label class="muted">Server</label>
  <input id="base" class="ltr" size="26" title="Base URL">
  <button id="btnHealth">Health</button>
  <span id="healthOut" class="muted"></span>
  <span class="grow"></span>
  <span id="who" class="pill">Not logged in</span>
  <button id="btnLogin" class="primary">Login (device)</button>
  <button id="btnLogout">Logout</button>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
"use strict";
// ============================================================================================================
// State
// ============================================================================================================
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("gs." + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gs." + k, v); } catch {} }
};
const S = {
  base: store.get("base", location.origin),
  token: store.get("token", ""), refresh: store.get("refresh", ""), userId: store.get("userId", ""), username: store.get("username", ""),
  deviceId: store.get("deviceId", "") || (() => { const d = "web-" + crypto.randomUUID().replace(/-/g, ""); store.set("deviceId", d); return d; })(),
};
const base = () => $("#base").value.replace(/\/+$/, "");
function saveSession(r) {
  S.token = r.token; S.refresh = r.refreshToken || S.refresh; S.userId = r.userId || S.userId; S.username = r.username || S.username;
  store.set("token", S.token); store.set("refresh", S.refresh); store.set("userId", S.userId); store.set("username", S.username);
  renderWho();
}
function clearSession() {
  S.token = S.refresh = S.userId = S.username = "";
  for (const k of ["token", "refresh", "userId", "username"]) store.set(k, "");
  renderWho();
}
function renderWho() {
  $("#who").textContent = S.token ? `${S.username || "?"} · ${S.userId.slice(0, 8)}…` : "Not logged in";
  $("#who").title = S.userId;
}

// ============================================================================================================
// HTTP helper (auto refresh on 401)
// ============================================================================================================
async function rawFetch(method, url, body, auth) {
  const headers = {};
  if (body !== undefined && body !== null && body !== "") headers["Content-Type"] = "application/json";
  if (auth && S.token) headers["Authorization"] = "Bearer " + S.token;
  const t0 = performance.now();
  const res = await fetch(url, { method, headers, body: body === undefined || body === "" ? undefined : body });
  const text = await res.text();
  let json = null; try { json = text ? JSON.parse(text) : null; } catch {}
  return { status: res.status, ok: res.ok, text, json, ms: Math.round(performance.now() - t0), headers: res.headers };
}
async function tryRefresh() {
  if (!S.refresh) return false;
  const r = await rawFetch("POST", base() + "/v1/auth/refresh", JSON.stringify({ refreshToken: S.refresh }), false);
  if (r.ok && r.json && r.json.token) { saveSession(r.json); return true; }
  return false;
}
async function api(method, url, body, auth = true) {
  let r = await rawFetch(method, url, body, auth);
  if (r.status === 401 && auth && await tryRefresh()) r = await rawFetch(method, url, body, auth);
  return r;
}
async function deviceLogin() {
  const r = await rawFetch("POST", base() + "/v1/auth/device", JSON.stringify({ deviceId: S.deviceId, create: true }), false);
  if (r.ok) saveSession(r.json);
  return r;
}

// ============================================================================================================
// Rendering endpoints
// ============================================================================================================
function fillTemplates(obj) {
  const s = JSON.stringify(obj, null, 2) ?? "";
  return s.replace("REPLACE_DEVICE", S.deviceId).replace("REPLACE_REFRESH", S.refresh).replace("REPLACE_UUID", crypto.randomUUID());
}
function curlOf(method, url, body, auth) {
  let c = `curl -X ${method} '${url}'`;
  if (auth) c += ` \\\n  -H 'Authorization: Bearer ${S.token ? S.token.slice(0, 16) + "…" : "<token>"}'`;
  if (body) c += ` \\\n  -H 'Content-Type: application/json' \\\n  -d '${body.replace(/\s*\n\s*/g, " ")}'`;
  return c;
}
function renderEndpoint(ep) {
  const params = [...ep.p.matchAll(/\{(\w+)\}/g)].map(x => x[1]);
  const inputs = {};
  const body = ep.body !== undefined ? el("textarea", { rows: Math.min(10, JSON.stringify(ep.body, null, 2).split("\n").length + 1) }) : null;
  if (body) body.value = fillTemplates(ep.body);
  const out = el("div");
  const root = el("div", { class: "card ep" });

  const head = el("div", { class: "ep-head", onclick: () => root.classList.toggle("open") },
    el("span", { class: "badge " + ep.m }, ep.m),
    el("span", { class: "ep-path" }, ep.p),
    el("span", { class: "muted" }, "— " + ep.t),
    ep.auth ? el("span", { class: "lock" }, "🔒") : "");

  const rows = [];
  for (const p of params) {
    const i = el("input", { class: "ltr", placeholder: p, value: (ep.ex && ep.ex[p]) || "" }); inputs["p:" + p] = i;
    rows.push(el("div", { class: "row" }, el("label", {}, p + " (path)"), i));
  }
  for (const [name, ex] of ep.q || []) {
    const i = el("input", { class: "ltr", placeholder: "(optional)", value: ex }); inputs["q:" + name] = i;
    rows.push(el("div", { class: "row" }, el("label", {}, name + " (query)"), i));
  }
  const send = el("button", { class: "primary", onclick: async () => {
    let path = ep.p;
    for (const p of params) {
      const v = inputs["p:" + p].value.trim();
      if (!v) { out.replaceChildren(el("pre", { class: "st bad" }, `پارامتر ${p} را پر کن`)); return; }
      path = path.replace("{" + p + "}", encodeURIComponent(v));
    }
    const qs = new URLSearchParams();
    for (const [name] of ep.q || []) { const v = inputs["q:" + name].value.trim(); if (v) qs.set(name, v); }
    const url = base() + path + (qs.toString() ? "?" + qs : "");
    let bodyText;
    if (body) {
      bodyText = body.value.trim();
      if (bodyText) { try { JSON.parse(bodyText); } catch (e) { if (ep.p.startsWith("/v1/rpc/") === false) { out.replaceChildren(el("pre", { class: "st bad" }, "JSON نامعتبر: " + e.message)); return; } } }
    }
    send.disabled = true;
    try {
      const r = await api(ep.m, url, bodyText, ep.auth);
      if (ep.p === "/v1/auth/device" && r.ok) saveSession(r.json);
      if (ep.p === "/v1/auth/refresh" && r.ok) saveSession(r.json);
      if (ep.p === "/v1/auth/logout" && r.ok) clearSession();
      const pretty = r.json !== null ? JSON.stringify(r.json, null, 2) : (r.text || "(empty)");
      out.replaceChildren(
        el("div", { class: "tools" }, el("span", { class: "st " + (r.ok ? "ok" : "bad") }, `${r.status}`), el("span", { class: "muted" }, `${r.ms} ms`),
          el("button", { onclick: () => navigator.clipboard.writeText(curlOf(ep.m, url, bodyText, ep.auth)) }, "کپی curl")),
        el("pre", {}, pretty));
    } catch (e) {
      out.replaceChildren(el("pre", { class: "st bad" }, "خطای شبکه: " + e.message + "\n(سرور بالاست؟ آدرس Server درست است؟)"));
    } finally { send.disabled = false; }
  } }, "Send");

  root.append(head, el("div", { class: "ep-body" },
    ep.d ? el("p", { class: "muted", style: "margin:0 0 8px" }, ep.d) : "",
    ...rows,
    body ? el("div", { class: "row", style: "align-items:flex-start" }, el("label", {}, "body (JSON)"), body) : "",
    el("div", { class: "tools" }, send), out));
  return root;
}

// ============================================================================================================
// Logging widget
// ============================================================================================================
function makeLog() {
  const box = el("div", { class: "log" });
  const add = (cls, text) => { box.append(el("div", { class: cls }, `${new Date().toLocaleTimeString("en-GB")}  ${text}`)); box.scrollTop = box.scrollHeight; };
  return { box, add, clear: () => box.replaceChildren() };
}
const pj = v => { try { return JSON.stringify(JSON.parse(v)); } catch { return v; } };

// ============================================================================================================
// Realtime tab (ws)
// ============================================================================================================
const RT = { ws: null, log: makeLog(), pending: new Map(), ping: null };
function rtConnect(path) {
  if (RT.ws) return;
  if (!S.token) { RT.log.add("err", "اول لاگین کن (دکمه بالا)."); return; }
  const u = new URL(base()); u.protocol = u.protocol === "https:" ? "wss:" : "ws:"; u.pathname = path || "/ws"; u.search = "";
  RT.log.add("sys", "connecting " + u);
  const ws = new WebSocket(u); RT.ws = ws;
  ws.onopen = () => { RT.log.add("sys", "open → sending auth"); rtSend("auth", { token: S.token }); setRtState(); };
  ws.onmessage = e => { RT.log.add("in", "⬇ " + pj(e.data)); };
  ws.onclose = e => { RT.log.add("sys", `closed (${e.code}) ${e.reason || ""}`); RT.ws = null; clearInterval(RT.ping); setRtState(); };
  ws.onerror = () => RT.log.add("err", "socket error");
  RT.ping = setInterval(() => { if (RT.ws && RT.ws.readyState === 1) rtSend("ping", {}, true); }, 25000);
}
function rtSend(type, data, quiet) {
  if (!RT.ws || RT.ws.readyState !== 1) { RT.log.add("err", "وصل نیستی."); return; }
  const frame = JSON.stringify({ type, id: crypto.randomUUID().slice(0, 8), data });
  RT.ws.send(frame); if (!quiet) RT.log.add("out", "⬆ " + frame);
}
function setRtState() { const b = $("#rtState"); if (b) b.textContent = RT.ws ? "connected" : "disconnected"; }
const RT_TEMPLATES = {
  "channel.join": { channel: "global" },
  "channel.send": { channel: "global", text: "سلام!" },
  "channel.leave": { channel: "global" },
  "channel.history": { channel: "global", limit: 20 },
  "matchmaker.add": { mode: "duel", properties: {} },
  "matchmaker.remove": { ticketId: "" },
  "match.create": { mode: "relay", label: "test" },
  "match.join": { matchId: "" },
  "match.list": { mode: "relay", limit: 20 },
};

// ============================================================================================================
// Match tab
// ============================================================================================================
const MT = { ws: null, log: makeLog() };
function mtConnect(url, token) {
  if (MT.ws) { MT.log.add("err", "قبلاً وصل است."); return; }
  const u = new URL(url, base()); if (u.protocol === "http:") u.protocol = "ws:"; if (u.protocol === "https:") u.protocol = "wss:";
  u.searchParams.set("token", token);
  MT.log.add("sys", "connecting " + u.origin + u.pathname);
  const ws = new WebSocket(u); ws.binaryType = "arraybuffer"; MT.ws = ws;
  ws.onopen = () => MT.log.add("sys", "open");
  ws.onmessage = e => {
    if (typeof e.data === "string") { MT.log.add("in", "⬇ text " + e.data); return; }
    const b = new Uint8Array(e.data); const txt = new TextDecoder().decode(b);
    MT.log.add("in", `⬇ ${b.length} bytes  hex=${[...b.slice(0, 24)].map(x => x.toString(16).padStart(2, "0")).join(" ")}${b.length > 24 ? "…" : ""}  utf8="${txt.replace(/[\x00-\x08]/g, "·")}"`);
  };
  ws.onclose = e => { MT.log.add("sys", `closed (${e.code}) ${e.reason || ""}`); MT.ws = null; };
  ws.onerror = () => MT.log.add("err", "socket error");
}
